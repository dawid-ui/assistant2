<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant IA — Base</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="chat-background">

  <div class="app">

    <!-- ===== EN-TÊTE ===== -->
    <header class="app__header">
      <div class="app__identity">
        <span class="app__avatar" id="avatar">🤖</span>
        <div>
          <h1 class="app__title" id="nomAssistant">Mon Assistant</h1>
          <p class="app__status" id="statutMode">API</p>
        </div>
      </div>
      <button class="app__settingsBtn" id="btnParametres" title="Notifications">🛎️</button>
    </header>
    <!-- ===== INBOX NOTIFICATIONS ===== -->
<section class="notifications" id="panneauNotifications" hidden>
  <div class="notifications__header">
    <strong>🛎️ Notifications</strong>
    <button type="button" id="btnFermerNotifications">×</button>
  </div>

  <div id="listeNotifications"></div>
</section>

    <!-- ===== PANNEAU PARAMÈTRES (masqué par défaut) ===== -->
    <section class="settings" id="panneauParametres" hidden>
      <p class="settings__hint">
        Réglages rapides pour tester. Pour une personnalisation durable,
        modifie <code>config.js</code>.
      </p>
      <label class="settings__row">
        Mode de chat
        <select id="selectModeChat">
          <option value="demo">Démo (aucune config)</option>
          <option value="api">API réelle</option>
        </select>
      </label>
      <label class="settings__row">
        Mode d'image
        <select id="selectModeImage">
          <option value="pollinations">Pollinations (gratuit, sans clé)</option>
          <option value="api">Mon API perso</option>
        </select>
      </label>
    </section>

    <!-- ===== FIL DE CONVERSATION ===== -->
    <main class="chat" id="filChat" aria-live="polite"></main>

    <!-- ===== SÉLECTEUR D'EMOJIS (masqué par défaut) ===== -->
    <div class="emojiPicker" id="emojiPicker" hidden></div>

    <!-- ===== ZONE DE SAISIE ===== -->
    <footer class="composer">
      <button class="composer__iconBtn" id="btnEmoji" title="Emojis">😊</button>
      <button class="composer__iconBtn" id="btnImage" title="Générer une image">🎨</button>
      <textarea
        class="composer__input"
        id="champSaisie"
        placeholder="Écris un message… (ou clique 🎨 pour une image)"
        rows="1"
      ></textarea>
      <button class="composer__sendBtn" id="btnEnvoyer" title="Envoyer">➤</button>
    </footer>

  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
